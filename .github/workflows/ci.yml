name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', 'memory-ui/v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_native_context:
        description: Publish the current Native Context Service package version
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Verify Node
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project
        run: pnpm check

  rust_lint:
    name: Lint Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust backend
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust_test:
    name: Test Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust backend
        run: cargo test --locked --workspace

      - name: Check Unix installer syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/install.sh

      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Test Windows staged installation failure
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1

  e2e:
    name: Test database loop
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test third-party plugin database loop
        run: pnpm test:e2e

  verify:
    name: Verify
    if: always()
    needs: [node, rust_lint, rust_test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check verification jobs
        run: |
          test "${{ needs.node.result }}" = success
          test "${{ needs.rust_lint.result }}" = success
          test "${{ needs.rust_test.result }}" = success
          test "${{ needs.e2e.result }}" = success

  package-plugin:
    name: Package DSH plugin
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build npm packages
        run: pnpm build

      - name: Create artifact directory
        run: >-
          node --eval "require('node:fs').mkdirSync('artifacts', { recursive: true })"

      - name: Pack protocol and plugins
        run: |
          pnpm --filter dsh-patchouli-protocol pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter patchouli-db pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter dsh-patchouli-agent-loop pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter dsh-patchouli-artifact-ingestor pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter dsh-patchouli-native-context-service pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter dsh-patchouli-session-indexer pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter dsh-patchouli-workspace-indexer pack --pack-destination "$GITHUB_WORKSPACE/artifacts"
          pnpm pack --pack-destination artifacts

      - name: Upload plugin packages
        uses: actions/upload-artifact@v4
        with:
          name: dsh-patchouli-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    name: Publish npm packages
    needs: [package-plugin, release-daemon]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release tag
        run: node scripts/validate-release-tag.ts

      - name: Download npm packages
        uses: actions/download-artifact@v4
        with:
          name: dsh-patchouli-${{ github.sha }}
          path: artifacts

      - name: Publish unpublished package versions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          packages=(
            dsh-patchouli-protocol
            patchouli-db
            dsh-patchouli-agent-loop
            dsh-patchouli-artifact-ingestor
            dsh-patchouli-native-context-service
            dsh-patchouli-session-indexer
            dsh-patchouli-workspace-indexer
            dsh-patchouli
          )
          for package in "${packages[@]}"; do
            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "${package}@${version} is already published"
              continue
            fi
            npm publish "./artifacts/${package}-${version}.tgz" --access public
          done

  publish-memory-ui:
    name: Publish Memory UI
    needs: verify
    if: startsWith(github.ref, 'refs/tags/memory-ui/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#memory-ui/v}"
          test "$(node -p "require('./packages/memory-ui/package.json').version")" = "$version"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Memory UI
        run: pnpm --filter dsh-patchouli-memory-ui check

      - name: Pack Memory UI
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/patchouli-memory-ui"
          mkdir -p "$artifact_dir"
          pnpm --filter dsh-patchouli-memory-ui pack --pack-destination "$artifact_dir"
          package_tarballs=("$artifact_dir"/*.tgz)
          test "${#package_tarballs[@]}" -eq 1
          echo "PACKAGE_TARBALL=${package_tarballs[0]}" >> "$GITHUB_ENV"

      - name: Publish Memory UI
        shell: bash
        run: |
          if npm view "dsh-patchouli-memory-ui@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "dsh-patchouli-memory-ui@$PACKAGE_VERSION is already published"
          else
            npm publish "$PACKAGE_TARBALL" --access public
          fi

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "$PACKAGE_TARBALL" --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  publish-native-context:
    name: Publish Native Context Service
    needs: package-plugin
    if: github.event_name == 'workflow_dispatch' && inputs.publish_native_context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download npm packages
        uses: actions/download-artifact@v4
        with:
          name: dsh-patchouli-${{ github.sha }}
          path: artifacts

      - name: Publish Native Context Service
        run: npm publish ./artifacts/dsh-patchouli-native-context-service-*.tgz --access public

  package-daemon:
    name: Package daemon (${{ matrix.artifact }})
    needs: verify
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/patchouli-db
            artifact: patchouli-db-linux-x86_64
            asset: patchouli-db-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/patchouli-db
            artifact: patchouli-db-linux-aarch64
            asset: patchouli-db-linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/patchouli-db
            artifact: patchouli-db-macos-x86_64
            asset: patchouli-db-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/patchouli-db
            artifact: patchouli-db-macos-aarch64
            asset: patchouli-db-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/patchouli-db.exe
            artifact: patchouli-db-windows-x86_64
            asset: patchouli-db-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/validate-release-tag.ts

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build Linux daemon
        if: runner.os == 'Linux'
        env:
          CC: musl-gcc
        run: cargo build --locked --release --bin patchouli-db --target ${{ matrix.target }}

      - name: Build daemon
        if: runner.os != 'Linux'
        run: cargo build --locked --release --bin patchouli-db --target ${{ matrix.target }}

      - name: Name release asset
        run: node --eval "const fs=require('node:fs'); fs.mkdirSync('dist'); fs.copyFileSync(process.argv[1], process.argv[2])" "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Write release checksum
        run: node --eval "const fs=require('node:fs'); const crypto=require('node:crypto'); const file=process.argv[1]; const name=process.argv[2]; const hash=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'); fs.writeFileSync(file+'.sha256', hash+'  '+name+'\n')" "dist/${{ matrix.asset }}" "${{ matrix.asset }}"

      - name: Upload daemon
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release-daemon:
    name: Publish daemon release
    needs: package-daemon
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download daemon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: patchouli-db-*
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/**/* --generate-notes
