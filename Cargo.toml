[workspace]
members = [
  "crates/backend",
  "crates/provider",
  "crates/provider-remote",
  "crates/provider-router",
  "crates/provider-sqlite",
  "crates/server",
]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/memorax-ai/dsh-patchouli"

[workspace.dependencies]
async-trait = "0.1"
async-stream = "0.3"
automerge = "0.11"
autosurgeon = "0.13"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
fs4 = "1.1"
hex = "0.4"
jsonschema = { version = "0.49.9", default-features = false }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
